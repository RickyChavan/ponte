<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F1E7" />
    <script>
      // Set the theme before first paint: the saved choice, else the system preference.
      (function () {
        var t = null;
        try { t = localStorage.getItem('ponte-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        document.documentElement.classList.add('js');
      })();
    </script>
    <title>Ponte | Build the bridge to your next stage</title>
    <meta
      name="description"
      content="Ponte builds and manages a dedicated pod of 4 to 6 skilled people for your startup or MSME. European work culture, Indian results."
    />
    <link rel="canonical" href="https://ponte.co.in/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ponte" />
    <meta property="og:title" content="Ponte | Build the bridge to your next stage" />
    <meta
      property="og:description"
      content="A dedicated pod of 4 to 6 skilled people for your startup or MSME, built and managed by Ponte."
    />
    <meta property="og:url" content="https://ponte.co.in/" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ponte | Build the bridge to your next stage" />
    <meta
      name="twitter:description"
      content="A dedicated pod of 4 to 6 skilled people for your startup or MSME, built and managed by Ponte."
    />
    <!-- TODO: add og:image / twitter:image (1200x630 PNG) once there is brand artwork or a photo. -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Ponte",
        "url": "https://ponte.co.in/",
        "logo": "https://ponte.co.in/logo.svg",
        "description": "Ponte builds and manages a dedicated pod of 4 to 6 skilled people for startups and MSMEs in India."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="config.js"></script>
    <script>
      // Hallmark slot helper: hallmarkSlots({ hero: '/photos/team.jpg' }) swaps a slot's picture without touching the layout.
      window.hallmarkSlots = (m) => { for (const [k, v] of Object.entries(m)) { const s = document.querySelector(`[data-slot="${k}"]`); if (!s) continue; const im = new Image(); im.src = typeof v === 'string' ? v : v.src; im.alt = (typeof v === 'object' && v.alt) || s.dataset.alt || ''; s.querySelectorAll(':scope > img').forEach((o) => o.remove()); s.prepend(im); } };
      document.querySelectorAll('[data-slot] img').forEach((i) => { if (i.complete && !i.naturalWidth) i.remove(); else i.addEventListener('error', () => i.remove(), { once: true }); });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
